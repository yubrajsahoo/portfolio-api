spring:
  application:
    name: portfolio-api
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  cache:
    type: caffeine
    cache-names:
      - cloud-file-urls
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=10m

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

springdotenv:
  filename: .evn

springdoc:
  swagger-ui:
    path: /api/docs
  api-docs:
    path: /api/openapi