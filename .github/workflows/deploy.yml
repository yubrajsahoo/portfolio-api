name: Spring Boot CI/CD Pipeline

on:
  pull_request:
    branches: [ "main" ]
    types: [ opened, synchronize, reopened ]
  push:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  # ==========================================================
  # 1. CI Stage: Runs on both Pull Request and Push to main
  #    Validates, compiles, and tests your application.
  # ==========================================================
  build:
    name: Build & Test (CI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up GraalVM JDK 21
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven

      - name: Compile and Test
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn clean verify

  # ==========================================================
  # 2. CD Stage: Runs ONLY when PR is merged (or pushed) to main
  #    Builds the Docker container, pushes to GHCR, and triggers Render
  # ==========================================================
  deploy:
    name: Build Image & Deploy (CD)
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Format Lowercase Repository Name
        id: repo_name
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Render Deployment via Deploy Hook
        run: |
          echo "Triggering Render Deploy Hook..."
          response=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}")
          if [ "$response" -ge 200 ] && [ "$response" -lt 300 ]; then
            echo "Successfully triggered Render deployment (HTTP $response)."
          else
            echo "Failed to trigger Render deployment. HTTP response code: $response"
            exit 1
          fi
